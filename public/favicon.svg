<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#09090b"/>
  <circle cx="32" cy="35" r="21" fill="#06b6d4" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="32" cy="35" r="16" fill="#09090b"/>
  <!-- Top button -->
  <rect x="28" y="7" width="8" height="5" rx="1.5" fill="#22d3ee"/>
  <rect x="30.5" y="12" width="3" height="3" fill="#22d3ee"/>
  <!-- Right button -->
  <rect x="47" y="14" width="5" height="3" rx="1" transform="rotate(45 47 14)" fill="#22d3ee"/>
  <!-- Clock hands pointing at 1h / active timer -->
  <line x1="32" y1="35" x2="32" y2="24" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="35" x2="41" y2="35" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="35" r="3" fill="#22d3ee"/>
</svg>
